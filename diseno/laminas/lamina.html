<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Alegreya;src:url(nm/@fontsource/alegreya/files/alegreya-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Alegreya;src:url(nm/@fontsource/alegreya/files/alegreya-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:"Alegreya Sans";src:url(nm/@fontsource/alegreya-sans/files/alegreya-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:"Alegreya Sans";src:url(nm/@fontsource/alegreya-sans/files/alegreya-sans-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:"Alegreya Sans";src:url(nm/@fontsource/alegreya-sans/files/alegreya-sans-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:"Chivo Mono";src:url(nm/@fontsource/chivo-mono/files/chivo-mono-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:"Chivo Mono";src:url(nm/@fontsource/chivo-mono/files/chivo-mono-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Archivo;src:url(nm/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2) format("woff2-variations");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"Schibsted Grotesk";src:url(nm/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:"Schibsted Grotesk";src:url(nm/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:"Schibsted Grotesk";src:url(nm/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-800-normal.woff2);font-weight:800}
*{box-sizing:border-box}body{margin:0;width:1440px;background:#e9e7e1;font-family:system-ui}
.lam{display:grid;grid-template-columns:390px 390px 1fr;gap:36px;padding:44px;align-items:start}
.tel{width:390px;height:780px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);font-family:var(--fb);box-shadow:0 30px 60px -30px rgba(0,0,0,.45);border:10px solid #111}
.tel .in{padding:18px 18px 0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:800 19px var(--fd)}
.mes{font:600 15px var(--fb);color:var(--ink)}.ava{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line)}
.hola{font:var(--hola);margin:4px 0 14px;letter-spacing:var(--hls)}
.hero{background:var(--hero);color:var(--heroInk);padding:18px;border-radius:var(--r);border:var(--bd);box-shadow:var(--sh);position:relative;overflow:hidden}
.et{font:600 13px var(--fb);opacity:.85;text-transform:var(--ett);letter-spacing:var(--etl)}
.big{font:var(--bigf);letter-spacing:var(--bigls);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.sub{font:400 13.5px/1.4 var(--fb);opacity:.85}
.barra{height:8px;border-radius:9px;background:rgba(127,127,127,.25);margin:14px 0 12px;overflow:hidden}.barra i{display:block;height:100%;width:72%;background:var(--heroBar);border-radius:9px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hoy{font:600 13.5px var(--fb)}.hoy b{font:var(--numf);font-size:17px;white-space:nowrap;display:block}
.btn{background:var(--acc);color:var(--onacc);border:var(--bbd);border-radius:var(--br);padding:11px 16px;font:700 14px var(--fb);box-shadow:var(--bsh);white-space:nowrap}
.h2{font:var(--h2f);margin:22px 0 10px;letter-spacing:var(--h2ls);text-transform:var(--h2t);text-decoration:var(--h2d);text-decoration-color:var(--marca);text-decoration-thickness:.4em;text-underline-offset:-.16em;text-decoration-skip-ink:none}
.ojo{display:grid;gap:8px}.oj{background:var(--surf);border:var(--cbd);border-radius:var(--rc);padding:11px 13px;box-shadow:var(--csh)}
.oj .fila span{font:600 14px var(--fb)}.oj .fila b{font:var(--numf);font-size:13px;color:var(--bad)}
.mini{height:5px;border-radius:5px;background:var(--line);margin-top:8px}.mini i{display:block;height:100%;border-radius:5px;background:var(--bad)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{border-radius:var(--rc);padding:11px 12px;border:var(--cbd);box-shadow:var(--csh)}
.cat span{font:600 13px var(--fb);display:block}.cat b{font:var(--numf);font-size:14px;display:block;margin-top:14px}
.nav{position:absolute;left:0;right:0;bottom:0;height:70px;background:var(--surf);border-top:var(--navb);display:flex;justify-content:space-around;align-items:center;font:600 11px var(--fb);color:var(--muted)}
.nav .mas{width:52px;height:52px;border-radius:var(--masr);background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:400 30px/1 var(--fb);border:var(--bbd);box-shadow:var(--bsh);margin-top:-26px}
.nav .act{color:var(--acc)}
.der{font-family:var(--fb);color:#1b1b1b}
.der h1{font:var(--tit);margin:0 0 6px;letter-spacing:var(--h2ls)}.der .idea{font:400 18px/1.45 var(--fb);margin:0 0 22px;max-width:520px}
.spec{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.spec .s1{font:var(--tit);font-size:40px;line-height:1}.spec .s2{font:400 16px/1.45 var(--fb);margin:10px 0}.spec .s3{font:var(--numf);font-size:30px}
.spec small{display:block;color:#6a6a6a;font:500 12.5px system-ui;margin-top:8px}
.pal{display:flex;gap:8px;margin-bottom:16px}.pal div{flex:1;height:58px;border-radius:10px;border:1px solid rgba(0,0,0,.1);display:flex;align-items:flex-end;padding:6px;font:600 10px system-ui}
.ilu{background:var(--ilubg);border-radius:14px;padding:10px;margin-bottom:16px;display:grid;place-items:center}.ilu svg{width:300px}
ul{margin:0;padding-left:18px;font:400 15px/1.5 var(--fb)}li{margin-bottom:4px}
</style></head><body><div class="lam" id="l"></div>
<script src="ilus.js"></script>
<script>
const D = {
 libreta:{ titulo:'A. Libreta de cuentas', idea:'El cuaderno donde la tienda del barrio anota lo que se debe y lo que entra. Papel, tinta y resaltador: cercano, honesto, nada de brillos.',

  bg:'repeating-linear-gradient(transparent 0 29px, rgba(30,95,70,.08) 29px 30px)',
  porque:['Letra con trazo de pluma y cifras de máquina de escribir: nada de la letra redonda de siempre.','Títulos subrayados con resaltador, no con la barra de color de todas las apps.','Ilustraciones a mano alzada, con una tinta y un color: se ven hechas por una persona.','Papel cálido y renglones muy suaves en lugar de degradados violeta.']},

  claro:{'--bg':'#fff4e2','--surf':'#fff','--ink':'#1b1a2e','--muted':'#5c5870','--line':'#ecdcc0','--acc':'#d9432b','--onacc':'#fff','--hero':'#ffb52e','--heroInk':'#1b1a2e','--heroBar':'#1b1a2e','--bad':'#c2321b','--catA':'#bfe5cf','--catB':'#ffd6a8','--catC':'#c9d4ff','--catD':'#ffc6bb'},
  oscuro:{'--bg':'#121220','--surf':'#1c1c2e','--ink':'#fff3e0','--muted':'#bdb6c9','--line':'#30304a','--acc':'#ff7a5c','--onacc':'#121220','--hero':'#ffb52e','--heroInk':'#1b1a2e','--heroBar':'#1b1a2e','--bad':'#ff8a70','--bd':'2.5px solid #fff3e0','--sh':'5px 5px 0 #000','--cbd':'2px solid #fff3e0','--csh':'3px 3px 0 #000','--bbd':'2.5px solid #fff3e0','--bsh':'3px 3px 0 #000','--navb':'2.5px solid #fff3e0','--catA':'#1f4a35','--catB':'#4a3412','--catC':'#262f5c','--catD':'#4d231b'},
  paleta:[['#fff4e2','arepa'],['#1b1a2e','tinta azul'],['#d9432b','achiote'],['#ffb52e','mango'],['#1f7a4d','hoja']],
  bg:'none',
  porque:['Contornos gruesos y sombras duras, como un sticker o un letrero: lo contrario del vidrio difuminado.','Letra ancha en mayúscula para los títulos, igual que en los rótulos pintados.','Colores sacados de la calle (achiote, mango, hoja), no del degradado violeta-azul de moda.','Ilustraciones de recorte plano: la tienda, el toldo, el marrano.']},
 editorial:{ titulo:'C. Editorial sobrio', idea:'Como el suplemento económico de un buen periódico: blanco, negro y un azul. La información manda y las cifras se ven como datos.',

   '--r':'6px','--rc':'6px','--bd':'0','--sh':'none','--cbd':'1px solid var(--line)','--csh':'none','--br':'6px','--bbd':'0','--bsh':'none','--masr':'16px','--navb':'1px solid var(--line)','--ilubg':'#fff'},

  oscuro:{'--bg':'#0d0f12','--surf':'#16191e','--ink':'#eef0f2','--muted':'#9aa1ab','--line':'#262a31','--acc':'#9db0ff','--onacc':'#0d0f12','--hero':'#eef0f2','--heroInk':'#0d0f12','--heroBar':'#2040c4','--bad':'#ff8a80','--catA':'#16191e','--catB':'#16191e','--catC':'#16191e','--catD':'#16191e'},
  paleta:[['#f4f4f0','papel prensa'],['#121417','negro'],['#2040c4','azul tinta'],['#c8d1f5','azul claro'],['#b8322a','rojo alerta']],
  bg:'none',
  porque:['Pocas tarjetas y mucho aire: líneas finas separan, en vez de cajas dentro de cajas.','Cifras en letra monoespaciada, alineadas como en una tabla del periódico.','Un solo color de marca; el resto es blanco y negro.','La ilustración son los propios datos (barras, metas), no dibujos genéricos.']}
};
const k=location.hash.slice(1), d=D[k];
const tel=(modo)=>{const v=Object.assign({},d.v,d[modo]);const st=Object.entries(v).map(([a,b])=>a+':'+b).join(';');
 return `<div class="tel" style="${st};background:var(--bg) ${modo==='claro'?d.bg.replace('none',''):''}"><div class="in">
 <div class="top"><div class="logo">F</div><div class="mes">Noviembre ▾</div><div class="ava"></div></div>

</script></body></html>
