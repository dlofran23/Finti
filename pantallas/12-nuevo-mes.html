<!-- Nuevo mes -->
<div id="dlg-mes" class="dlg-backdrop" hidden>
  <div class="dlg sm" role="dialog" aria-modal="true" aria-labelledby="dlg-mes-title">
    <div class="dlg-head">
      <h2 id="dlg-mes-title">Nuevo mes</h2>
      <button class="btn" type="button" data-close>Cancelar</button>
    </div>
    <section>
      <label for="f-nuevo-mes" class="hint">Mes</label>
      <input id="f-nuevo-mes" type="month">
      <label class="check"><input type="checkbox" id="f-copiar" checked> <span>Copiar conceptos, categorías, días de pago y montos planeados del mes que estás viendo. Lo real empieza en cero.</span></label>
      <p class="warn-box" id="mes-free-warn" hidden></p>
      <p class="msg err" id="mes-status"></p>
      <div class="row">
        <button class="btn primary" type="button" id="btn-crear-mes">Crear mes</button>
        <button class="btn" type="button" id="btn-borrar-mes" hidden>Eliminar el mes que estás viendo</button>
      </div>
    </section>
  </div>
</div>
