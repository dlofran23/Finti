<!-- Tu cuenta (C2) -->
<div id="dlg-perfil" class="dlg-backdrop sheet" hidden>
  <div class="dlg sheet-panel cta-panel" role="dialog" aria-modal="true" aria-labelledby="perfil-t">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head"><h2 id="perfil-t">Tu cuenta</h2><button class="btn" type="button" data-close>Listo</button></div>
    <div class="acct-card"><div class="acct-who" id="perfil-who"></div></div>
    <div class="acct-card">
      <div class="acct-who">
        <span class="cta-ic sm ok" id="perfil-est-ic" aria-hidden="true"><svg class="ic"><use href="#i-cloud-ok"/></svg></span>
        <div class="acct-name"><b id="perfil-est">Todo guardado</b><span id="perfil-est-sub"></span></div>
        <button class="btn" type="button" id="perfil-copiar">Copiar ya</button>
      </div>
      <div>
        <label class="switch-row"><span><b>Copia automática</b><span>Cada vez que registras algo.</span></span><span class="switch"><input type="checkbox" id="perfil-auto" checked><i></i></span></label>
        <label class="switch-row"><span><b>Clave de cifrado propia</b><span>Ni Finti podría leer tus cifras. Si la olvidas, no se puede recuperar.</span></span><span class="switch"><input type="checkbox" id="perfil-e2e"><i></i></span></label>
      </div>
      <div class="e2e-form" id="perfil-e2e-form" hidden>
        <div class="cta-field"><label for="e2e-1">Crea tu clave (mínimo 8 caracteres)</label><input id="e2e-1" type="password" autocomplete="new-password"></div>
        <div class="cta-field"><label for="e2e-2">Repítela</label><input id="e2e-2" type="password" autocomplete="new-password"></div>
        <p class="mov-warn">Anótala en un lugar seguro. Te la pediremos en cada dispositivo nuevo y, si la pierdes, nadie podrá abrir tu copia en la nube.</p>
        <div class="row"><button class="btn primary" type="button" id="e2e-ok">Activar cifrado</button><button class="btn" type="button" id="e2e-no">Cancelar</button></div>
      </div>
      <p class="msg" id="perfil-msg" aria-live="polite"></p>
    </div>
    <div class="opt-list">
      <div class="opt-h"><svg class="ic" aria-hidden="true"><use href="#i-devices"/></svg><b>Dispositivos conectados</b></div>
      <div class="dev-list in" id="perfil-dev"><p class="hint">Cargando…</p></div>
      <button type="button" id="perfil-descargar"><svg class="ic" aria-hidden="true"><use href="#i-down"/></svg><span>Descargar todos mis datos</span></button>
      <button type="button" id="perfil-salir"><svg class="ic" aria-hidden="true"><use href="#i-logout"/></svg><span>Cerrar sesión en este dispositivo</span></button>
    </div>
    <button class="danger-link" type="button" id="perfil-borrar">Borrar mi cuenta y mis datos de la nube</button>
    <p class="hint center legal-links"><a href="/legal/privacidad.html" target="_blank" rel="noopener">Política de datos</a> · <a href="/legal/terminos.html" target="_blank" rel="noopener">Términos</a></p>
  </div>
</div>
