<!-- Pagar una cuenta -->
<div id="dlg-pagar" class="dlg-backdrop sheet" hidden>
  <div class="dlg sheet-panel" role="dialog" aria-modal="true" aria-labelledby="dlg-pagar-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="dlg-head">
      <h2 id="dlg-pagar-title">Pagar</h2>
      <button class="btn" type="button" data-close>Cerrar</button>
    </div>
    <p class="hint" id="pagar-sub"></p>
    <div class="amount-box">
      <span class="amount-cur">$</span>
      <input id="pagar-monto" class="amount-input" type="text" inputmode="numeric" autocomplete="off" aria-label="Monto pagado">
    </div>
    <div id="pagar-cuentas-wrap">
      <h3 class="sheet-h" id="pagar-cq">¿Desde qué cuenta? <span class="opt">(opcional)</span></h3>
      <div class="chips-row" id="pagar-cuentas" role="radiogroup" aria-labelledby="pagar-cq"></div>
    </div>
    <label class="switch-row" for="pagar-sumar">
      <span><b id="pagar-sumar-t">Sumarlo a mis gastos</b><span id="pagar-sumar-s"></span></span>
      <span class="switch"><input type="checkbox" id="pagar-sumar" checked><i></i></span>
    </label>
    <button class="btn primary big" type="button" id="pagar-ok">Marcar como pagado</button>
  </div>
</div>
