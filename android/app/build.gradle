plugins { id 'com.android.application' }

android {
    namespace 'co.fintelligente.app'
    compileSdk project.hasProperty('sim') ? 34 : 36

    defaultConfig {
        applicationId 'co.fintelligente.app'
        minSdk 24
        targetSdk project.hasProperty('sim') ? 34 : 36
        versionCode 11
        versionName '1.10'
    }

    // La llave de firma NO va en el repositorio: se pasa por variables de entorno al compilar.
    signingConfigs {
        release {
            storeFile file(System.getenv('FIN_KEYSTORE') ?: 'no-existe.jks')
            storePassword System.getenv('FIN_KS_PASS') ?: ''
            keyAlias 'fintelligente'
            keyPassword System.getenv('FIN_KS_PASS') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    testOptions { unitTests { includeAndroidResources = true; all {
            maxHeapSize = '2g'
            // Sin internet (como en el entorno de Claude): usa las imágenes de Android ya descargadas en ROBOLECTRIC_DIR.
            if (System.getenv('ROBOLECTRIC_DIR')) { systemProperty 'robolectric.offline', 'true'; systemProperty 'robolectric.dependency.dir', System.getenv('ROBOLECTRIC_DIR') }
        } } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
